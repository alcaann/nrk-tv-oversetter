<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NRK TV Oversetter</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="brand">
    <img src="../../icons/icon48.png" alt="" width="32" height="32">
    <div>
      <h1>NRK TV Oversetter</h1>
      <p>Norwegian subtitles, translated on your device</p>
    </div>
  </header>

  <section>
    <h2 class="eyebrow">Mode</h2>
    <div id="modes"></div>
  </section>

  <section>
    <label class="eyebrow" for="target-language">Translate to</label>
    <select id="target-language">
      <option value="">Loading languages…</option>
    </select>
  </section>

  <section class="model" id="model-status">
    <div class="model-header">
      <span class="dot" id="model-status-dot"></span>
      <span id="model-status-text">Checking model…</span>
    </div>
    <div class="progress" id="progress-track" hidden><div id="progress-bar"></div></div>
    <div class="model-info" id="model-info"></div>
  </section>

  <footer>
    <button class="link" id="open-settings">All settings</button>
    <span id="version"></span>
  </footer>

  <script src="popup.js" type="module"></script>
</body>
</html>
