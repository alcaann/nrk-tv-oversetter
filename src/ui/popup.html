<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NRK TV Oversetter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h1>NRK TV Oversetter</h1>
    <div class="subtitle">Subtitle Translator</div>
  </div>

  <div class="status" id="status">
    <span id="status-text">Loading...</span>
  </div>

  <div class="control-group">
    <div class="toggle-container">
      <span class="toggle-label">Enable Translation</span>
      <label class="toggle-switch">
        <input type="checkbox" id="toggle-enabled">
        <span class="slider"></span>
      </label>
    </div>

    <div class="language-selector">
      <label for="target-language">Translate to:</label>
      <select id="target-language">
        <option value="">Loading languages...</option>
      </select>
    </div>

    <div class="language-selector">
      <label for="translation-engine">Translation Engine:</label>
      <select id="translation-engine">
        <option value="edge">Built-in Browser Translation</option>
        <option value="google" disabled>Google Translate (Coming Soon)</option>
        <option value="deepl" disabled>DeepL (Coming Soon)</option>
      </select>
    </div>
  </div>

  <div class="model-status" id="model-status">
    <div class="model-status-header">
      <span class="model-status-dot" id="model-status-dot"></span>
      <span id="model-status-text">Checking model...</span>
    </div>
    <div class="progress-track" id="progress-track" style="display: none;">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="model-info" id="model-info"></div>
  </div>

  <button class="button" id="open-settings">Advanced Settings</button>

  <div class="footer">
    v0.2.0 | For NRK TV
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
